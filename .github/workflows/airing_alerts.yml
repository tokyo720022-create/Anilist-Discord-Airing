name: AniList Airing Alerts

on:
  schedule:
    # Minute 17 avoids the busiest top-of-hour queue; every hour.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anilist-airing-alerts
  cancel-in-progress: false

jobs:
  airing-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile airing_alerts.py

      - name: Run airing radar
        env:
          ANILIST_USERNAME: Orewatokyo
          ANILIST_TARGET_TOKEN: ${{ secrets.ANILIST_TARGET_TOKEN }}
          DISCORD_AIRING_WEBHOOK: ${{ secrets.DISCORD_AIRING_WEBHOOK }}
        run: python -u airing_alerts.py

      - name: Save alert history, cache and board state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db_anime_airing.json airing_cache.json daily_board.json
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "chore: update airing radar state [skip ci]"
          git push origin HEAD:main

      - name: Send failure notification
        if: failure()
        env:
          DISCORD_AIRING_WEBHOOK: ${{ secrets.DISCORD_AIRING_WEBHOOK }}
        run: |
          if [ -z "${DISCORD_AIRING_WEBHOOK:-}" ]; then
            echo 'Discord webhook secret is not configured; cannot send failure alert.'
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -X POST "$DISCORD_AIRING_WEBHOOK" \
            -d '{"content":"⚠️ **Tokyo Airing Radar failed.** Check the latest GitHub Actions run for the error details."}'

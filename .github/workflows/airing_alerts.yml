name: AniList Airing Alerts

on:
  schedule:
    # GitHub Actions uses UTC. This runs hourly (at :30 every hour in India).
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anilist-airing-alerts
  cancel-in-progress: false

jobs:
  airing-alerts:
    name: Check upcoming anime episodes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # The first run removes the old sync engines, databases, telemetry, and workflows.
      # Only the five files required for airing alerts are retained.
      - name: Remove legacy project files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          keep = {
              "README.md",
              "requirements.txt",
              "db_anime_airing.json",
              "airing_alerts.py",
              ".github/workflows/airing_alerts.yml",
          }
          root = Path(".")

          for path in root.rglob("*"):
              if ".git" in path.parts:
                  continue
              if path.is_file() and path.as_posix() not in keep:
                  path.unlink()

          for path in sorted(
              (item for item in root.rglob("*") if item.is_dir()),
              key=lambda item: len(item.parts),
              reverse=True,
          ):
              if ".git" in path.parts:
                  continue
              try:
                  path.rmdir()
              except OSError:
                  pass
          PY

      - name: Check AniList and send Discord alerts
        env:
          ANILIST_USERNAME: Orewatokyo
          ANILIST_TARGET_TOKEN: ${{ secrets.ANILIST_TARGET_TOKEN }}
          DISCORD_AIRING_WEBHOOK: ${{ secrets.DISCORD_AIRING_WEBHOOK }}
        run: python -u airing_alerts.py

      - name: Save alert history and repository cleanup
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No alert history or cleanup changes to save."
            exit 0
          fi

          git commit -m "chore: keep hourly AniList airing alerts only [skip ci]"

          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            git rebase origin/main
          fi

          git push origin HEAD:main

name: Tokyo Airing Radar

on:
  schedule:
    # Active every 15 minutes from 10:00 AM through 9:45 PM India time.
    # IST is UTC+5:30. The engine remains idle from 10:00 PM to 10:00 AM IST.
    - cron: '30,45 4 * * *'
    - cron: '*/15 5-15 * * *'
    - cron: '0,15 16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: anilist-airing-alerts
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile airing_alerts.py anime_intelligence.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  airing-alerts:
    needs: tests
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check operating window (10:00 AM–10:00 PM IST)
        id: operating_window
        shell: bash
        run: |
          local_time="$(TZ=Asia/Kolkata date '+%H:%M')"
          hour="${local_time%%:*}"
          hour=$((10#${hour}))
          echo "India time now: ${local_time}"
          if (( hour >= 10 && hour < 22 )); then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "Airing Radar is inside its operating window."
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Airing Radar is resting. Operating window is 10:00–22:00 IST."
          fi
      - name: Run airing radar
        if: steps.operating_window.outputs.active == 'true'
        env:
          ANILIST_USERNAME: Orewatokyo
          ANILIST_TARGET_TOKEN: ${{ secrets.ANILIST_TARGET_TOKEN }}
          DISCORD_AIRING_WEBHOOK: ${{ secrets.DISCORD_AIRING_WEBHOOK }}
        run: python -u airing_alerts.py
      - name: Save alert history, cache, board and intelligence state
        if: success() && steps.operating_window.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db_anime_airing.json airing_cache.json daily_board.json anime_preferences.json schedule_history.json anime_stats.json
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "chore: update airing radar state [skip ci]"
          git push origin HEAD:main
      - name: Send failure notification
        if: failure() && steps.operating_window.outputs.active == 'true'
        env:
          DISCORD_AIRING_WEBHOOK: ${{ secrets.DISCORD_AIRING_WEBHOOK }}
        run: |
          if [ -z "${DISCORD_AIRING_WEBHOOK:-}" ]; then
            echo 'Discord webhook secret is not configured; cannot send failure alert.'
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -X POST "$DISCORD_AIRING_WEBHOOK" \
            -d '{"content":"⚠️ **Tokyo Airing Radar failed.** Check the latest GitHub Actions run for the error details."}'
